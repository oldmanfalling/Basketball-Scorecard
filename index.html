<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css"
    
</head>
<body>
   <div class="container">

        <div id="scorecard">

            <div id="infoWrapper">
                <h3>HOME</h3>
                <div id="scoreWrapper">
                    <p id="homeScore">
                     0
                    </p>
                 </div>

                 <div id="addWrapper">
                    <button class="addOnebutton" onclick="addOneHome()">+1</button>
                 <button class="addOnebutton" onclick="addTwoHome()">+2</button>
                 <button class="addOnebutton" onclick="addThreeHome()">+3</button>
                </div>

          </div>

          <div id="infoWrapper">
             <h3>AWAY</h3>
             <div id="scoreWrapper">
                 <p id="guestScore">
                        0
                    </p>
             </div>

             <div id="addWrapper">
                 <button class="addOnebutton" onclick="addOneGuest()">+1</button>
                  <button class="addOnebutton" onclick="addTwoGuest()">+2</button>
                  <button class="addOnebutton" onclick="addThreeGuest()">+3</button>
               </div>

         </div>

        </div>

         <div id="resetHolder">
            <button class="reset" onclick="reset()">RESET</button>
        </div>

    
   </div>
    <script src="index.js"></script>
</body>
</html>
